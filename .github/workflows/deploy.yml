name: Deploy Image2Base64 (Cloudflare Worker)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare dist (rsync repo root -> dist, excluding git/worker/wrangler)
        # dist/ is gitignored and not a real build output — it is a copy of the
        # static assets. Reproduce it exactly as documented in README.md.
        run: |
          rsync -a --exclude '.git' --exclude 'dist' --exclude '.claude' \
            --exclude '.wrangler' --exclude 'worker.js' --exclude 'wrangler.toml' \
            --exclude '.assetsignore' --exclude '.github' --exclude '.gitignore' \
            --exclude 'LICENSE' --exclude 'README.md' --exclude 'SEO_LOG.md' \
            --exclude '*.md' --exclude 'check_seo_consistency.py' ./ dist/

      - name: Deploy Worker
        # Only fires once the CLOUDFLARE_API_TOKEN secret is configured in the repo.
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler@4.129.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "0319b5a34ac9ec72788d13d5cf706846"
