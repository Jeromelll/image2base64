name: Deploy Image2Base64 (Cloudflare Worker)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
    # Job-level env so the step-level `if` can read it (the `secrets`
    # context is not available in step `if` conditionals).
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "0319b5a34ac9ec72788d13d5cf706846"
    steps:
      - uses: actions/checkout@v4

      - name: Test shared OAuth implementation
        run: node --test site-auth/tests/*.test.mjs

      - name: Test photo tools, analytics, and image conversion
        run: node --test tests/*.test.js tests/*.test.mjs

      - name: Check SEO consistency
        run: python3 check_seo_consistency.py

      - name: Build public assets
        run: python3 build.py

      - name: Verify Worker bundle without deploying
        run: npx wrangler@4.129.0 deploy --dry-run

      - name: Deploy Worker
        id: deploy
        # Only fires once the CLOUDFLARE_API_TOKEN secret is configured in the repo.
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          npx wrangler@4.129.0 deploy
          echo "deployed=true" >> "$GITHUB_OUTPUT"

  post-deploy-probe:
    name: post-deploy-probe
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Probe live site after deploy
        run: node scripts/probe-production.mjs
